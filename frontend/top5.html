<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP-5 - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; }
        .btn-primary { background: #8b5cf6; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #8b5cf6; }
        select { background: #12121a; border: 1px solid #2a2a3a; color: #fff; }
        .verdict-SCALE { background: rgba(34,197,94,0.2); color: #22c55e; }
        .verdict-STOP { background: rgba(239,68,68,0.2); color: #ef4444; }
        .verdict-OPTIMIZE { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .verdict-CONTINUE, .verdict-HOLD { background: rgba(234,179,8,0.2); color: #eab308; }
        .rank-1 { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
        .rank-2 { background: linear-gradient(135deg, #9ca3af, #6b7280); }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #a0522d); }
        .rank-4, .rank-5 { background: #12121a; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/top5" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <a href="/ai-company-analysis" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="building-2" class="w-4 h-4"></i>Campaign Analysis</a>
                <a href="/ai-search-gold" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="search" class="w-4 h-4"></i>Search for Gold</a>
                <a href="/re-checking" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="refresh-cw" class="w-4 h-4"></i>Re-checking</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-6">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="trophy" class="w-6 h-6 text-yellow-400"></i>TOP-5 МАСШТАБИРОВАТЬ</h1>
                <div class="flex items-center gap-3">
                    <select id="periodSelect" class="px-3 py-2 rounded-lg text-sm" onchange="toggleCustomDate()">
                        <option value="7" selected>7 дней</option><option value="14">14 дней</option><option value="30">30 дней</option>
                        <option value="custom">Кастом дата</option>
                    </select>
                    <div id="customDateRange" class="hidden flex items-center gap-2">
                        <input type="date" id="customDateFrom" class="px-2 py-1.5 rounded text-sm bg-zinc-800 border border-zinc-600">
                        <span class="text-zinc-500">—</span>
                        <input type="date" id="customDateTo" class="px-2 py-1.5 rounded text-sm bg-zinc-800 border border-zinc-600">
                    </div>
                    <button onclick="loadTop5()" class="btn-primary px-4 py-2 rounded-lg text-sm">Обновить</button>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="card p-4"><div class="text-zinc-400 text-sm">Общий профит</div><div id="totalProfit" class="text-2xl font-bold text-green-400">$0</div></div>
                <div class="card p-4"><div class="text-zinc-400 text-sm">SCALE</div><div id="scaleCount" class="text-2xl font-bold text-green-400">0</div></div>
                <div class="card p-4"><div class="text-zinc-400 text-sm">STOP</div><div id="stopCount" class="text-2xl font-bold text-red-400">0</div></div>
            </div>
            <div id="top5Cards" class="space-y-4 mb-8"></div>
            <div class="card p-4">
                <h3 class="font-semibold mb-4">Все кампании</h3>
                <table class="w-full text-left text-sm">
                    <thead><tr class="border-b border-zinc-700"><th class="px-3 py-2">Кампания</th><th class="px-3 py-2">Источник</th><th class="px-3 py-2 text-center">Вердикт</th><th class="px-3 py-2 text-right">Score</th><th class="px-3 py-2 text-right">ROI</th><th class="px-3 py-2 text-right">Profit</th><th class="px-3 py-2">Тренд</th></tr></thead>
                    <tbody id="allTable"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); setDefaultCustomDates(); toggleCustomDate(); loadTop5(); });
        function setDefaultCustomDates() {
            const to = new Date();
            const from = new Date(to);
            from.setDate(from.getDate() - 6);
            document.getElementById('customDateFrom').value = from.toISOString().slice(0, 10);
            document.getElementById('customDateTo').value = to.toISOString().slice(0, 10);
        }
        function toggleCustomDate() {
            const el = document.getElementById('customDateRange');
            if (!el) return;
            if (document.getElementById('periodSelect').value === 'custom') { el.classList.remove('hidden'); el.classList.add('flex'); }
            else { el.classList.add('hidden'); el.classList.remove('flex'); }
        }
        function copyId(el) {
            const t = el.dataset.copy || '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(t).then(() => { el.title='Скопировано!'; }).catch(() => { copyFallback(t); el.title='Скопировано!'; });
            } else { copyFallback(t); el.title='Скопировано!'; }
        }
        function copyFallback(t) {
            const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText='position:fixed;opacity:0;'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        function getPeriodParams() {
            const sel = document.getElementById('periodSelect');
            if (sel.value === 'custom') {
                const from = document.getElementById('customDateFrom').value;
                const to = document.getElementById('customDateTo').value;
                if (from && to) return 'date_from=' + encodeURIComponent(from) + '&date_to=' + encodeURIComponent(to);
            }
            return 'period=' + (sel ? sel.value : '30');
        }
        async function loadTop5() {
            const periodParam = getPeriodParams();
            const res = await fetch(`/api/bot-agent/top5?${periodParam}`);
            const data = await res.json();
            
            document.getElementById('totalProfit').textContent = '$' + data.summary.total_profit.toLocaleString();
            document.getElementById('scaleCount').textContent = data.summary.scale_count;
            document.getElementById('stopCount').textContent = data.summary.stop_count;
            
            document.getElementById('top5Cards').innerHTML = data.campaigns.map((c, i) => `
                <div class="card p-4">
                    <div class="flex items-start gap-4">
                        <div class="rank-${i+1} w-12 h-12 rounded-lg flex items-center justify-center text-xl font-bold">#${i+1}</div>
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-semibold">${c.campaign} <span class="text-zinc-500 text-sm font-normal cursor-pointer hover:text-zinc-300" data-copy="${(c.campaign_id||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="copyId(this)" title="Нажми, чтобы скопировать">(${c.campaign_id || ''})</span></h3>
                                <span class="verdict-${c.verdict} px-2 py-0.5 rounded text-xs">${c.verdict}</span>
                            </div>
                            <div class="text-zinc-500 text-sm">${c.source}</div>
                        </div>
                        <div class="grid grid-cols-4 gap-6 text-right">
                            <div><div class="text-zinc-500 text-xs">Score</div><div class="text-xl font-bold">${Math.round(c.bot_score)}</div></div>
                            <div><div class="text-zinc-500 text-xs">ROI</div><div class="text-xl font-bold ${c.roi >= 0 ? 'text-green-400' : 'text-red-400'}">${c.roi}%</div></div>
                            <div><div class="text-zinc-500 text-xs">Profit</div><div class="text-xl font-bold ${c.profit >= 0 ? 'text-green-400' : 'text-red-400'}">$${c.profit.toLocaleString()}</div></div>
                            <div><div class="text-zinc-500 text-xs">Conf</div><div class="text-xl font-bold">${Math.round(c.confidence)}%</div></div>
                        </div>
                    </div>
                    <div class="mt-3 p-3 bg-zinc-800/50 rounded-lg text-sm text-zinc-300">${(c.reasoning || (c.summary_lines || []).join('; ')).replace(/</g,'&lt;')}</div>
                </div>
            `).join('');
            
            document.getElementById('allTable').innerHTML = data.all_campaigns.map(c => `
                <tr class="border-b border-zinc-800">
                    <td class="px-3 py-2">${c.campaign}</td>
                    <td class="px-3 py-2 text-zinc-400">${c.source}</td>
                    <td class="px-3 py-2 text-center"><span class="verdict-${c.verdict} px-2 py-0.5 rounded text-xs">${c.verdict}</span></td>
                    <td class="px-3 py-2 text-right">${Math.round(c.bot_score)}</td>
                    <td class="px-3 py-2 text-right ${c.roi >= 0 ? 'text-green-400' : 'text-red-400'}">${c.roi}%</td>
                    <td class="px-3 py-2 text-right ${c.profit >= 0 ? 'text-green-400' : 'text-red-400'}">$${c.profit.toLocaleString()}</td>
                    <td class="px-3 py-2">${c.trend === 'IMPROVING' ? '📈' : c.trend === 'DECLINING' ? '📉' : '➡️'} ${c.trend}</td>
                </tr>
            `).join('');
            
            lucide.createIcons();
        }
    </script>
</body>
</html>
