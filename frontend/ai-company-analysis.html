<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Analysis - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #8b5cf6; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/bot-top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <a href="/ai-company-analysis" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="building-2" class="w-4 h-4"></i>Company Analysis</a>
                <a href="/ai-search-gold" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="search" class="w-4 h-4"></i>Search for Gold</a>
                <a href="/re-checking" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="refresh-cw" class="w-4 h-4"></i>Re-checking</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-6">
            <h1 class="text-2xl font-bold mb-6">Company Analysis</h1>
            <div class="card p-4 mb-6" style="background:#1a1a24; border:1px solid #2a2a3a; border-radius:12px;">
                <div class="flex gap-4 items-end flex-wrap">
                    <div class="flex-1 min-w-[200px]">
                        <label class="text-sm text-zinc-400 block mb-1">Campaign</label>
                        <select id="campaignSelect" class="w-full px-3 py-2 rounded-lg bg-zinc-800 border border-zinc-600 text-white">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="w-40">
                        <label class="text-sm text-zinc-400 block mb-1">Period</label>
                        <select id="periodSelect" class="w-full px-3 py-2 rounded-lg bg-zinc-800 border border-zinc-600 text-white">
                            <option value="7">7 days</option>
                            <option value="14" selected>14 days</option>
                            <option value="30">30 days</option>
                        </select>
                    </div>
                    <button id="loadBtn" class="px-4 py-2 rounded-lg bg-purple-600 hover:bg-purple-700 font-medium">Analyze</button>
                </div>
            </div>
            <div id="analysisResult" class="space-y-4"></div>
        </main>
    </div>
    <script>
        lucide.createIcons();
        async function loadCampaigns() {
            const res = await fetch('/api/metrics/campaigns?period=30');
            const data = await res.json();
            const sel = document.getElementById('campaignSelect');
            const campaigns = data.campaigns || [];
            sel.innerHTML = campaigns.length
                ? campaigns.map(c => `<option value="${(c.campaign_id||'').replace(/"/g,'&quot;')}">${(c.campaign||'').replace(/^[^-]+-\s*/i,'')} (${c.source||''})</option>`).join('')
                : '<option value="">No campaigns</option>';
        }
        function copyId(el) {
            const t = el.dataset.copy || '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(t).then(() => { el.title='Скопировано!'; }).catch(() => { copyFallback(t); el.title='Скопировано!'; });
            } else { copyFallback(t); el.title='Скопировано!'; }
        }
        function copyFallback(t) {
            const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText='position:fixed;opacity:0;'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }
        document.getElementById('loadBtn').onclick = async () => {
            const cid = document.getElementById('campaignSelect').value;
            const period = document.getElementById('periodSelect').value;
            if (!cid) { alert('Select campaign'); return; }
            const res = await fetch(`/api/company-analytics/analysis?campaign_id=${encodeURIComponent(cid)}&period=${period}`);
            const data = await res.json();
            const div = document.getElementById('analysisResult');
            if (!data.success) {
                div.innerHTML = '<p class="text-red-400">' + (data.error || 'Error') + '</p>';
                return;
            }
            const a = data.analysis;
            const lines = (a.summary_lines || []).map(l => '<div class="text-zinc-300 py-1">' + l.replace(/</g,'&lt;') + '</div>').join('');
            div.innerHTML = `
                <div class="card p-6" style="background:#1a1a24; border:1px solid #2a2a3a; border-radius:12px;">
                    <h2 class="text-xl font-bold mb-4">${(a.campaign||'').replace(/</g,'&lt;')} <span class="text-zinc-500 text-sm font-normal cursor-pointer hover:text-zinc-300" data-copy="${(a.campaign_id||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="copyId(this)" title="Нажми, чтобы скопировать">(${(a.campaign_id||'').replace(/</g,'&lt;')})</span></h2>
                    <div class="text-zinc-400 text-sm mb-4">ROI ${a.roi}% • Profit $${a.profit} • Spend $${a.spend} • Clicks ${a.clicks} • Conv ${a.conversions}</div>
                    <div class="space-y-1 mb-4">${lines}</div>
                    <div class="text-xs text-zinc-500">Volatility ${a.volatility}% • ${a.days_with_data}/${a.total_days} days</div>
                </div>
            `;
        };
        loadCampaigns();
    </script>
</body>
</html>
