<!DOCTYPE html>
<html lang="en">

<head>

    <script>/* Suppress Tailwind CDN prod warning */var _w = console.warn; console.warn = function (m) { if (typeof m === 'string' && m.indexOf('cdn.tailwindcss.com') !== -1) return; _w.apply(console, arguments); };</script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Дополнительные стили для исправления макета */
        .grid-cols-1 {
            grid-template-columns: repeat(1, minmax(0, 1fr));
        }

        .grid-cols-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-cols-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .grid-cols-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        @media (min-width: 768px) {
            .md\:grid-cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

        @media (min-width: 1024px) {
            .lg\:grid-cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .lg\:grid-cols-3 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
    </style>
    <style>
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: system-ui, sans-serif;
        }

        .sidebar {
            background: #12121a;
            border-right: 1px solid #2a2a3a;
        }

        .card {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
        }

        .nav-item {
            border-radius: 8px;
        }

        .nav-item:hover {
            background: rgba(139, 92, 246, 0.1);
        }

        .nav-item.active {
            background: #8b5cf6;
        }

        select {
            background: #12121a;
            border: 1px solid #2a2a3a;
            color: #fff;
        }

        .verdict-SCALE {
            color: #22c55e;
        }

        .verdict-STOP {
            color: #ef4444;
        }

        .verdict-OPTIMIZE {
            color: #3b82f6;
        }

        .verdict-HOLD {
            color: #eab308;
        }

        .profit-green {
            color: #22c55e;
        }

        .profit-red {
            color: #ef4444;
        }

        .driver-card {
            padding: 0.875rem 1rem;
            border-left-width: 4px;
        }

        .driver-negative {
            border-left-color: #ef4444;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.05) 0%, transparent 100%);
        }

        .driver-positive {
            border-left-color: #22c55e;
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.05) 0%, transparent 100%);
        }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.7rem;
        }

        .badge-red {
            background: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }

        .badge-green {
            background: #052e16;
            color: #86efac;
            border: 1px solid #14532d;
        }

        .metrics-hero {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .metrics-hero .profit {
            font-size: 1.35rem;
        }

        .dyn-table {
            min-width: max-content;
            font-size: 0.7rem;
        }

        .dyn-table th,
        .dyn-table td {
            padding: 4px 6px;
            min-width: 2rem;
            text-align: center;
        }

        .flow-row {
            background: #12121a;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.8rem;
        }

        .campaigns-table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 400px;
            border: 1px solid #2a2a3a;
            border-radius: 10px;
            background: #12121a;
        }

        .period-btn {
            padding: 6px 12px;
            border-radius: 8px;
            background: #2a2a3a;
            font-size: 13px;
            cursor: pointer;
        }

        .period-btn.active {
            background: #8b5cf6;
        }

        .period-btn:hover {
            background: #3f3f46;
        }
    </style>
</head>

<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div
                    class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard"
                        class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy"
                        class="w-4 h-4"></i>TOP-5</a>
                <a href="/ai-company-analysis" class="nav-item active flex items-center gap-3 px-3 py-2"><i
                        data-lucide="building-2" class="w-4 h-4"></i>Campaign Analysis</a>
                <a href="/ai-search-gold" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="search"
                        class="w-4 h-4"></i>Search for Gold</a>
                <a href="/re-checking" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="refresh-cw"
                        class="w-4 h-4"></i>Re-checking</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="settings"
                        class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-4">
            <!-- Header + Filters in one row -->
            <div class="flex flex-wrap items-center gap-3 mb-4">
                <h1 class="text-xl font-bold flex items-center gap-2 shrink-0"><i data-lucide="building-2"
                        class="w-5 h-5 text-purple-400"></i>Campaign Analysis</h1>
                <select id="sourceSelect"
                    class="px-3 py-1.5 rounded-lg bg-zinc-800 border border-zinc-600 text-white text-sm min-w-[140px]"
                    onchange="onSourceChange()">
                    <option value="">Source...</option>
                </select>
                <select id="campaignSelect"
                    class="px-3 py-1.5 rounded-lg bg-zinc-800 border border-zinc-600 text-white text-sm flex-1 min-w-[180px] max-w-[360px]">
                    <option value="">Campaign...</option>
                </select>
                <div class="flex gap-0.5">
                    <button type="button" class="period-btn py-1 px-2 text-xs" data-period="3"
                        onclick="setPeriod(3)">3</button>
                    <button type="button" class="period-btn py-1 px-2 text-xs" data-period="7"
                        onclick="setPeriod(7)">7</button>
                    <button type="button" class="period-btn active py-1 px-2 text-xs" data-period="14"
                        onclick="setPeriod(14)">14</button>
                    <button type="button" class="period-btn py-1 px-2 text-xs" data-period="30"
                        onclick="setPeriod(30)">30</button>
                    <button type="button" class="period-btn py-1 px-2 text-xs" data-period="custom"
                        onclick="setPeriod('custom')">Custom</button>
                </div>
                <div id="customDateRange" class="hidden flex items-center gap-1">
                    <input type="date" id="customDateFrom"
                        class="px-2 py-1 rounded text-xs bg-zinc-800 border border-zinc-600">
                    <span class="text-zinc-500 text-xs">—</span>
                    <input type="date" id="customDateTo"
                        class="px-2 py-1 rounded text-xs bg-zinc-800 border border-zinc-600">
                </div>
                <button id="loadBtn"
                    class="px-4 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-700 font-medium text-sm shrink-0">Analyze</button>
            </div>

            <div id="analysisResult" class="space-y-6"></div>
        </main>
    </div>
    <script>
        lucide.createIcons();
        let currentPeriod = 14;
        let currentCampaignId = null;
        let currentAnalysisData = null;

        function setDefaultCustomDates() {
            const to = new Date();
            const from = new Date(to);
            from.setDate(from.getDate() - 13);
            document.getElementById('customDateFrom').value = from.toISOString().slice(0, 10);
            document.getElementById('customDateTo').value = to.toISOString().slice(0, 10);
        }
        function setPeriod(p) {
            currentPeriod = p;
            document.querySelectorAll('.period-btn').forEach(b => { b.classList.remove('active'); if (b.dataset.period == p) b.classList.add('active'); });
            const el = document.getElementById('customDateRange');
            if (p === 'custom') { el.classList.remove('hidden'); el.classList.add('flex'); setDefaultCustomDates(); }
            else { el.classList.add('hidden'); el.classList.remove('flex'); }

            // Reload sources when the period changes
            loadSources();
            document.getElementById('campaignSelect').innerHTML = '<option value="">Campaign...</option>';
        }
        function getPeriodParams() {
            if (currentPeriod === 'custom') {
                const from = document.getElementById('customDateFrom').value;
                const to = document.getElementById('customDateTo').value;
                if (from && to) return 'date_from=' + encodeURIComponent(from) + '&date_to=' + encodeURIComponent(to);
            }
            return 'period=' + currentPeriod;
        }
        function getPeriodNum() {
            if (currentPeriod === 'custom') {
                const from = document.getElementById('customDateFrom').value;
                const to = document.getElementById('customDateTo').value;
                if (from && to) return Math.ceil((new Date(to) - new Date(from)) / 86400000);
            }
            return typeof currentPeriod === 'number' ? currentPeriod : 14;
        }

        async function loadSources() {
            const periodParam = getPeriodParams();
            const listPeriod = (currentPeriod === 'custom') ? ('date_from=' + encodeURIComponent(document.getElementById('customDateFrom').value) + '&date_to=' + encodeURIComponent(document.getElementById('customDateTo').value)) : ('period=' + Math.max(getPeriodNum(), 7));
            const res = await fetch(`/api/metrics/sources?${listPeriod}`, { cache: 'no-store' });
            const data = await res.json();
            const sel = document.getElementById('sourceSelect');
            sel.innerHTML = '<option value="">Source...</option>' + (data.sources || []).map(s => `<option value="${s}">${s}</option>`).join('');
        }
        function onSourceChange() {
            loadCampaigns();
            document.getElementById('campaignSelect').innerHTML = '<option value="">Campaign...</option>';
        }
        async function loadCampaigns() {
            const source = document.getElementById('sourceSelect').value;
            if (!source) return;
            const listPeriod = (currentPeriod === 'custom') ? ('date_from=' + encodeURIComponent(document.getElementById('customDateFrom').value) + '&date_to=' + encodeURIComponent(document.getElementById('customDateTo').value)) : ('period=' + getPeriodNum());
            const res = await fetch(`/api/metrics/campaigns?source=${encodeURIComponent(source)}&min_cost=20&${listPeriod}`, { cache: 'no-store' });
            const data = await res.json();
            const sel = document.getElementById('campaignSelect');
            const campaigns = data.campaigns || [];
            sel.innerHTML = campaigns.length
                ? campaigns.map(c => `<option value="${(c.campaign_id || '').replace(/"/g, '"')}">${(c.campaign || '').replace(/^[^-]+-\s*/i, '')} ($${c.spend})</option>`).join('')
                : '<option value="">No campaigns</option>';
        }

        function escapeHtml(s) { return (s || '').replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>'); }
        function copyId(el) {
            const t = el.dataset.copy || '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(t).then(() => { el.title = 'Скопировано!'; }).catch(() => { copyFallback(t); el.title = 'Скопировано!'; });
            } else { copyFallback(t); el.title = 'Скопировано!'; }
        }
        function copyFallback(t) {
            const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
        }

        function getDateList() {
            let dateFrom, dateTo;
            if (currentPeriod === 'custom') {
                const fromStr = document.getElementById('customDateFrom').value;
                const toStr = document.getElementById('customDateTo').value;
                if (!fromStr || !toStr) { const t = new Date(); dateTo = t; dateFrom = new Date(t); dateFrom.setDate(dateFrom.getDate() - 13); }
                else { dateFrom = new Date(fromStr); dateTo = new Date(toStr); }
            } else {
                const days = getPeriodNum() || 14;
                dateTo = new Date();
                dateFrom = new Date(dateTo);
                dateFrom.setDate(dateFrom.getDate() - (days - 1));
            }
            const list = [];
            const cur = new Date(dateFrom);
            while (cur <= dateTo) {
                const m = String(cur.getMonth() + 1).padStart(2, '0');
                const d = String(cur.getDate()).padStart(2, '0');
                list.push(m + '-' + d);
                cur.setDate(cur.getDate() + 1);
            }
            return list.slice(-30).reverse();
        }

        document.getElementById('loadBtn').onclick = loadAnalysis;

        async function loadAnalysis() {
            const cid = document.getElementById('campaignSelect').value;
            const source = document.getElementById('sourceSelect').value;
            if (!cid) { alert('Select Traffic Source and Campaign'); return; }
            if (!source) { alert('Select Traffic Source first'); return; }

            const periodParam = getPeriodParams();
            document.getElementById('loadBtn').disabled = true;
            document.getElementById('loadBtn').textContent = 'Loading...';

            try {
                const [analysisRes, dailyRes, decisionsRes] = await Promise.all([
                    fetch(`/api/company-analytics/analysis?campaign_id=${encodeURIComponent(cid)}&${periodParam}` + (source ? `&source=${encodeURIComponent(source)}` : '')).catch(e => ({ ok: false, json: async () => ({ success: false, error: e.message }) })),
                    fetch(`/api/metrics/campaign-daily-row?campaign_id=${encodeURIComponent(cid)}&${periodParam}` + (source ? `&source=${encodeURIComponent(source)}` : '')).catch(() => ({})),
                    fetch(`/api/bot-agent/campaign-decisions?campaign_id=${encodeURIComponent(cid)}`).catch(() => ({}))
                ]);
                const analysisData = await analysisRes.json();
                const dailyData = dailyRes.ok && dailyRes.json ? await dailyRes.json() : { days: {}, found: false };
                const decisionsData = decisionsRes.ok && decisionsRes.json ? await decisionsRes.json() : { decisions: [] };

                currentCampaignId = cid;
                currentAnalysisData = analysisData;

                const div = document.getElementById('analysisResult');
                if (!analysisData.success) {
                    div.innerHTML = '<p class="text-red-400">' + escapeHtml(analysisData.error || 'Error') + '</p>';
                    return;
                }

                const a = analysisData.analysis;
                const dates = getDateList();
                const dateLabels = dates.map(d => { const [mm, dd] = d.split('-'); return dd + '.' + mm; });
                const days = analysisData.days || dailyData.days || {};
                const dateCells = dates.map(d => {
                    const dayData = days[d];
                    if (!dayData) return '<td class="text-zinc-600">—</td>';
                    const bg = dayData.color === 'red' ? 'bg-red-900/30' : (dayData.color === 'green' ? 'bg-green-900/30' : '');
                    return '<td class="' + bg + '">' + dayData.profit + '</td>';
                }).join('');

                const botProposal = a.verdict || 'HOLD';
                const decisions = decisionsData.decisions || [];

                const killers = a.profit_killers || [];
                const profitThreshold = Math.max(1, Math.min(10, Math.floor(Math.abs(a.profit || 0) / 2)));
                const strengths = (a.strengths || []).filter(s => Math.abs(s.profit || 0) >= profitThreshold);
                const weaknesses = (a.weaknesses || []).filter(w => Math.abs(w.profit || 0) >= profitThreshold);

                // ==================== УЛУЧШЕННЫЙ БЛОК "KEY DRIVERS" ====================
                let keyDriversCards = '';
                const hasDeepAnalysis = analysisData.deep_analysis && analysisData.deep_analysis.key_drivers_extended;
                const hasParameterCategories = analysisData.deep_analysis && analysisData.deep_analysis.parameter_category_summary;
                let paramCategories = null;
                let filteredParams = [];

                // Проверяем, есть ли данные для нового формата Key Drivers
                if (hasParameterCategories) {
                    // ===== НОВЫЙ ФОРМАТ: Компактные параметры по категориям =====
                    paramCategories = analysisData.deep_analysis.parameter_category_summary;

                    // Преобразуем объект в массив для сортировки
                    // ИНТЕЛЛЕКТУАЛЬНАЯ ФИЛЬТРАЦИЯ ПАРАМЕТРОВ согласно спецификации
                    filteredParams = Object.entries(paramCategories)
                        .filter(([paramName, paramData]) => {
                            // 1. Параметры с impact_score < 5% должны скрываться
                            if (Math.abs(paramData.impact_score || 0) < 5) return false;

                            // 2. Параметры, где все значения "(empty)" и трафик 100% - скрывать
                            const topValues = paramData.top_values || [];
                            const allEmpty = topValues.length > 0 && topValues.every(val =>
                                !val.value || val.value === "(empty)" || val.value === "empty"
                            );
                            if (allEmpty && (paramData.traffic_pct || 0) > 95) return false;

                            // 3. Параметры без конверсий и с трафиком < 5% - скрывать
                            if ((paramData.total_conversions || 0) === 0 && (paramData.traffic_pct || 0) < 5) return false;

                            // 4. Параметры с одним значением и отрицательным profit показывать только при impact_score > 50%
                            if (paramData.total_values === 1 && (paramData.total_profit || 0) < 0) {
                                return Math.abs(paramData.impact_score) > 50;
                            }

                            // Параметр прошел все фильтры
                            return true;
                        })
                        .sort(([, a], [, b]) => Math.abs(b.impact_score || 0) - Math.abs(a.impact_score || 0))
                        .slice(0, 9); // Максимальное количество карточек: 9

                    const sortedParams = filteredParams;

                    keyDriversCards = sortedParams.map(([paramName, paramData]) => {
                        const displayStyle = paramData.display_style || { color: 'gray', icon: '⏸️' };
                        const rec = paramData.recommendation || 'HOLD';
                        // Цветные бейджи для рекомендаций
                        const recBadgeColor = {
                            'SCALE': 'bg-green-900 text-green-300 border-green-700',
                            'OPTIMIZE': 'bg-blue-900 text-blue-300 border-blue-700',
                            'FIX': 'bg-red-900 text-red-300 border-red-700',
                            'TEST': 'bg-yellow-900 text-yellow-300 border-yellow-700',
                            'HOLD': 'bg-gray-900 text-gray-300 border-gray-700'
                        }[rec] || 'bg-gray-900 text-gray-300 border-gray-700';

                        const isPositive = paramData.total_profit >= 0;
                        const borderClass = isPositive ? 'border-l-4 border-green-500' : 'border-l-4 border-red-500';
                        const bgClass = isPositive ? 'bg-gradient-to-r from-green-900/10 to-transparent' : 'bg-gradient-to-r from-red-900/10 to-transparent';

                        // Форматируем строки значений с индивидуальными метриками
                        const topValues = paramData.top_values || [];
                        const valuesRowsHtml = topValues.slice(0, 5).map(val => {
                            const valIsPositive = val.profit >= 0;
                            const valColor = valIsPositive ? 'text-green-300' : 'text-red-300';
                            const valBg = valIsPositive ? 'hover:bg-green-900/10' : 'hover:bg-red-900/10';
                            const profitStr = (valIsPositive ? '+' : '') + '$' + Math.abs(val.profit).toFixed(0);
                            const shortVal = val.value && val.value.length > 18 ? val.value.substring(0, 18) + '…' : (val.value || '(empty)');
                            const recColor = {
                                'SCALE': 'text-green-400', 'OPTIMIZE': 'text-blue-400',
                                'FIX': 'text-red-400', 'TEST': 'text-yellow-400', 'HOLD': 'text-gray-400'
                            }[val.recommendation] || 'text-gray-400';
                            return `
                                <div class="grid py-1 px-2 rounded ${valBg} border-b border-zinc-800/50 last:border-0 items-center" style="grid-template-columns: 130px 52px 48px 40px 48px 46px 36px">
                                    <span class="font-mono text-[11px] ${valColor} truncate" title="${escapeHtml(val.value)}">${escapeHtml(shortVal)}</span>
                                    <span class="font-bold text-[12px] ${valColor} text-right">${profitStr}</span>
                                    <span class="text-[11px] text-zinc-300 text-right">${val.roi}%</span>
                                    <span class="text-[11px] text-zinc-300 text-right">${val.conversions}</span>
                                    <span class="text-[11px] text-zinc-300 text-right">${val.traffic_pct}%</span>
                                    <span class="text-[11px] text-zinc-300 text-right">${val.profit_pct}%</span>
                                    <span class="text-[10px] ${recColor} font-bold text-right">${val.recommendation || ''}</span>
                                </div>
                            `;
                        }).join('');

                        return `
                            <div class="card driver-card ${borderClass} ${bgClass} p-0 overflow-hidden" data-category="${paramData.category || 'other'}">
                                <div class="p-3 pb-1">
                                    <div class="flex justify-between items-center mb-2">
                                        <div class="flex items-center gap-2">
                                            <span class="text-base">${paramData.icon || '⚫'}</span>
                                            <div>
                                                <div class="font-bold text-white text-sm uppercase tracking-wide">${escapeHtml(paramName)}</div>
                                                <div class="text-[10px] text-zinc-500">${paramData.category || 'other'} • ${paramData.total_values || 0} значений • влияние <strong class="text-zinc-300">${paramData.impact_score || 0}%</strong></div>
                                            </div>
                                        </div>
                                        <div class="text-[10px] px-2 py-0.5 rounded ${recBadgeColor} border font-bold">${rec}</div>
                                    </div>
                                </div>

                                <div class="px-1 pb-2">
                                    <div class="grid text-[9px] text-zinc-500 px-2 py-0.5 mb-0.5 uppercase tracking-wider" style="grid-template-columns: 130px 52px 48px 40px 48px 46px 36px">
                                        <span>Значение</span>
                                        <span class="text-right">Профит</span>
                                        <span class="text-right">ROI</span>
                                        <span class="text-right">Конв</span>
                                        <span class="text-right">Трафик</span>
                                        <span class="text-right">Проф%</span>
                                        <span class="text-right">Экшн</span>
                                    </div>
                                    ${valuesRowsHtml || '<div class="text-[10px] text-zinc-600 px-2 py-1">Нет данных</div>'}
                                </div>
                            </div>
                        `;
                    }).join('');

                } else if (hasDeepAnalysis) {
                    // ===== СТАРЫЙ ФОРМАТ ГЛУБОКОГО АНАЛИЗА =====
                    // Используем глубокий анализ
                    const deepDrivers = analysisData.deep_analysis.key_drivers_extended;

                    // 1. Killer Patterns
                    const killerPatternsCards = (deepDrivers.killer_patterns || []).map(pattern => {
                        const severityClass = pattern.severity === 'critical' ? 'bg-red-900/40 border-red-700' :
                            pattern.severity === 'high' ? 'bg-red-800/30 border-red-600' : 'bg-red-700/20 border-red-500';
                        return `
                            <div class="card driver-card driver-negative border-l-4 border-red-500 ${severityClass}">
                                <div class="flex justify-between items-start mb-1.5">

                                        <span class="${(c.profit || 0) >= 0 ? 'text-green-400' : 'text-red-400'} font-bold shrink-0">$${c.profit || 0}</span>
                                    </div>
                                    `).join('') : '<p class="text-zinc-600 text-[10px]">Нет данных.</p>'}
                                </div>
                            </div>
                            
                            <!-- ПРАВАЯ КОЛОНКА (Фабрика) -->
                            <div>
                                <h4 class="text-[11px] font-bold text-zinc-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <div class="w-1.5 h-1.5 rounded-full bg-blue-500"></div> 
                                    Глобальный анализ (Opportunity Engine)
                                </h4>
                                <div class="space-y-0">
                                    ${factoryHtml}
                                </div>
                            </div>
                            
                        </div>
                    </div>

                    <div class="card p-4 mb-4">
                        <h3 class="font-semibold mb-4">Решение</h3>
                        <p class="text-zinc-500 text-sm mb-3">Бот предлагает: <span class="verdict-${botProposal} font-medium">${botProposal}</span></p>
                        <div class="flex flex-wrap items-center gap-4 mb-3">
                            <div class="flex gap-3">
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="verdict" value="SCALE" class="rounded"> <span class="verdict-SCALE">SCALE</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="verdict" value="HOLD" class="rounded"> <span class="verdict-HOLD">HOLD</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="verdict" value="OPTIMIZE" class="rounded"> <span class="verdict-OPTIMIZE">OPTIMIZE</span></label>
                                <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" name="verdict" value="STOP" class="rounded"> <span class="verdict-STOP">STOP</span></label>
                            </div>
                            <select id="recheckSelect" class="px-2 py-1.5 rounded text-sm bg-zinc-800 border border-zinc-600">
                                <option value="0">Recheck: нет</option>
                                <option value="1">1 day</option>
                                <option value="2">2 days</option>
                                <option value="3" selected>3 days</option>
                                <option value="5">5 days</option>
                                <option value="7">7 days</option>
                            </select>
                            <input type="text" id="userComment" placeholder="Комментарий (опционально)" class="px-3 py-1.5 rounded text-sm bg-zinc-800 border border-zinc-600 flex-1 min-w-[200px]">
                            <button type="button" onclick="onApply()" class="px-5 py-2.5 rounded-lg bg-green-600 hover:bg-green-700 font-semibold text-white border-2 border-green-500">Apply — записать в память</button>
                        </div>
                    </div>

                    <details class="card overflow-hidden">
                        <summary class="list-none cursor-pointer p-3 text-xs text-zinc-500 hover:text-zinc-300">История решений (${decisions.length})</summary>
                        <div class="px-3 pb-3 space-y-1.5">
                            ${decisions.length ? decisions.map(d => `
                            <div class="text-xs py-1.5 border-b border-zinc-800 last:border-0">
                                ${escapeHtml(d.decision_date)} — <span class="verdict-${d.bot_proposal || 'HOLD'}">${d.bot_proposal || ''}</span> → <span class="verdict-${d.user_choice || 'HOLD'}">${d.user_choice || ''}</span>
                                ${d.user_comment ? '<span class="text-zinc-500 block">' + escapeHtml(d.user_comment) + '</span>' : ''}
                            </div>
                            `).join('') : '<p class="text-zinc-500 text-sm">Нет записей</p>'}
                        </div>
                    </details>
                `;
                lucide.createIcons();

                // Добавляем обработчики для фильтров категорий
                if (hasParameterCategories) {
                    setupCategoryFilters();
                }
            } finally {
                document.getElementById('loadBtn').disabled = false;
                document.getElementById('loadBtn').textContent = 'Analyze';
            }
        }

        // Вспомогательные функции для обратной совместимости
        function generateKeyDriversItems(killers, weaknesses, strengths, profitThreshold) {
            const items = [];
            killers.forEach(k => {
                const w = weaknesses.find(x => x.type === k.type && String(x.value) === String(k.value));
                items.push({
                    negative: true,
                    label: (k.type || '') + ' ' + (k.value || ''),
                    profit: w ? w.profit : -k.spend,
                    text: '<strong class="text-red-400">Killer.</strong> 0 конверсий, spend $' + k.spend + ' > порог $' + k.threshold + ' (2× payout/conv). Отключить.',
                    meta: 'Spend: $' + k.spend
                });
            });
            weaknesses.filter(w => !killers.some(k => k.type === w.type && String(k.value) === String(w.value))).forEach(w => {
                if (Math.abs(w.profit || 0) < profitThreshold) return;
                items.push({
                    negative: true,
                    label: (w.type || '') + ' ' + (w.value || ''),
                    profit: w.profit,
                    text: 'Слив бюджета. ROI низкий, ' + (w.traffic_pct || 0) + '% трафика.',
                    meta: 'Spend: $' + w.spend + ' • ROI: ' + (w.profit && w.spend ? Math.round(w.profit / w.spend * 100) : 0) + '%'
                });
            });
            strengths.forEach(s => {
                items.push({
                    negative: false,
                    label: (s.type || '') + ' ' + (s.value || ''),
                    profit: s.profit,
                    text: '<strong class="text-green-400">Top Performer.</strong> ' + (s.profit_pct || 0) + '% профита при ' + (s.traffic_pct || 0) + '% трафика.',
                    meta: 'Spend: $' + s.spend + ' • ROI: +' + (s.roi || 0) + '%'
                });
            });
            items.sort((x, y) => Math.abs(y.profit) - Math.abs(x.profit));
            return items;
        }

        function generateKeyDriversCards(items) {
            return items.map(item =>
                '<div class="card driver-card ' + (item.negative ? 'driver-negative' : 'driver-positive') + '">' +
                '<div class="flex justify-between items-start mb-1.5"><div class="font-bold text-white text-sm">' + escapeHtml(item.label) + '</div>' +
                '<span class="badge ' + (item.negative ? 'badge-red' : 'badge-green') + '">' + (item.profit >= 0 ? '+' : '') + '$' + item.profit + '</span></div>' +
                '<p class="text-xs text-zinc-300 leading-relaxed">' + item.text + '</p>' +
                '<div class="mt-2 pt-2 border-t border-dashed ' + (item.negative ? 'border-red-900/30' : 'border-green-900/30') + ' text-[10px] text-zinc-500">' + escapeHtml(item.meta) + '</div></div>'
            ).join('');
        }

        async function onApply() {
            const cid = currentCampaignId;
            if (!cid) { alert('Сначала загрузите анализ'); return; }
            const checked = Array.from(document.querySelectorAll('input[name="verdict"]:checked')).map(el => el.value);
            const verdict = checked.length ? checked.join(',') : 'HOLD';
            const recheck = parseInt(document.getElementById('recheckSelect')?.value || 0, 10);
            const comment = document.getElementById('userComment')?.value?.trim() || '';

            const body = {
                campaign_id: cid,
                verdict,
                recheck_after_days: recheck,
                confidence: currentAnalysisData?.analysis?.confidence || 0,
                bot_proposal: currentAnalysisData?.analysis?.verdict || 'HOLD',
                user_comment: comment || undefined,
                context_snapshot: currentAnalysisData ? {
                    profit: currentAnalysisData.analysis?.profit,
                    roi: currentAnalysisData.analysis?.roi,
                    volatility: currentAnalysisData.analysis?.volatility,
                    conversions: currentAnalysisData.analysis?.conversions,
                    spend: currentAnalysisData.analysis?.spend,
                    period_days: getPeriodNum(),
                    bot_conclusions: Object.values(currentAnalysisData.parameter_conclusions || {}).map(c => c.conclusion).filter(Boolean)
                } : undefined
            };

            const res = await fetch('/api/bot-agent/apply', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message || 'Применено');
                window.location.href = '/re-checking';  // Переход на Re-check — видишь все отменеженные кампании
            } else {
                alert(data.error || 'Ошибка');
            }
        }

        function setupCategoryFilters() {
            const container = document.getElementById('keyDriversContainer');
            const filterButtons = document.querySelectorAll('.category-filter');

            // Сохраняем оригинальное содержимое контейнера ДО любых изменений
            const originalContainerHTML = container.innerHTML;

            // Инициализируем data-атрибуты категорий для каждой карточки
            const allCards = container.querySelectorAll('.driver-card');
            allCards.forEach(card => {
                // Категория уже сохранена в data-category при создании карточки
                if (!card.dataset.category) {
                    card.dataset.category = 'other';
                }
            });

            filterButtons.forEach(button => {
                button.addEventListener('click', function () {
                    // Сбрасываем активное состояние у всех кнопок
                    filterButtons.forEach(btn => {
                        btn.classList.remove('active', 'bg-purple-700', 'text-white');
                        btn.classList.add('bg-zinc-800', 'text-zinc-300');
                    });

                    // Устанавливаем активное состояние для текущей кнопки
                    this.classList.remove('bg-zinc-800', 'text-zinc-300');
                    this.classList.add('active', 'bg-purple-700', 'text-white');

                    const selectedCategory = this.dataset.category;

                    if (selectedCategory === 'all') {
                        // ВОССТАНАВЛИВАЕМ оригинальное содержимое контейнера
                        container.innerHTML = originalContainerHTML;

                        // Снова инициализируем data-атрибуты для восстановленных карточек
                        const restoredCards = container.querySelectorAll('.driver-card');
                        restoredCards.forEach(card => {
                            if (!card.dataset.category) {
                                card.dataset.category = 'other';
                            }
                        });
                    } else {
                        // Фильтруем по выбранной категории
                        const allCards = container.querySelectorAll('.driver-card');
                        let hasVisibleCards = false;

                        allCards.forEach(card => {
                            if (card.dataset.category === selectedCategory) {
                                card.style.display = 'block';
                                hasVisibleCards = true;
                            } else {
                                card.style.display = 'none';
                            }
                        });

                        // Показываем сообщение если нет карточек в этой категории
                        const noDataMessage = container.querySelector('.text-zinc-500.text-sm.col-span-full');
                        if (!hasVisibleCards) {
                            if (!noDataMessage) {
                                container.innerHTML = '<p class="text-zinc-500 text-sm col-span-full">Нет параметров в категории "' + selectedCategory + '"</p>';
                            }
                        } else {
                            // Если есть видимые карточки, удаляем сообщение "нет параметров"
                            if (noDataMessage) {
                                noDataMessage.remove();
                            }
                        }
                    }
                });
            });
        }

        setDefaultCustomDates();
        loadSources();
    </script>
</body>

</html>
