<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings Stop & Optimize - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #ef4444; }
        select, textarea, input { background: #12121a; border: 1px solid #2a2a3a; color: #fff; padding: 8px; border-radius: 6px; }
        .btn-primary { background: #8b5cf6; }
        .btn-success { background: #22c55e; }
        .toggle-switch { position: relative; width: 44px; height: 24px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a4a5a; transition: .4s; border-radius: 24px; }
        .toggle-slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .toggle-slider { background-color: #8b5cf6; }
        input:checked + .toggle-slider:before { transform: translateX(20px); }
    </style>
    <link rel="stylesheet" href="/assets/theme.css">
    <script src="/assets/date-utils.js"></script>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-red-500 to-orange-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <a href="/monetization" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="zap" class="w-4 h-4"></i>Monetization</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/bot-top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <a href="/bot-stop-optimize" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="alert-triangle" class="w-4 h-4 text-red-400"></i>Stop &amp; Optimize</a>
                <a href="/ai-company-analysis" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="building-2" class="w-4 h-4"></i>Campaign Analysis</a>
                <a href="/ai-search-gold" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="search" class="w-4 h-4"></i>Search for Gold</a>
                <a href="/re-checking" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="refresh-cw" class="w-4 h-4"></i>Re-checking</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        
        <main class="ml-56 flex-1 p-6">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <a href="/settings" class="text-zinc-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                    <h1 class="text-2xl font-bold">Settings Stop & Optimize</h1>
                </div>
                <button onclick="addNewAgent()" class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Agent
                </button>
            </div>
            
            <!-- Header: Campaign + Period selector -->
            <div class="card p-4 mb-6 flex gap-4 items-center">
                <div class="flex-1">
                    <label class="text-sm text-zinc-400 block mb-1">Campaign</label>
                    <select id="campaignSelect" class="w-full">
                        <option value="">Loading campaigns...</option>
                    </select>
                </div>
                <div class="w-48">
                    <label class="text-sm text-zinc-400 block mb-1">Period</label>
                    <select id="periodSelect" class="w-full" onchange="toggleCustomDate()">
                        <option value="yesterday">Yesterday</option>
                        <option value="this_week">This week</option>
                        <option value="last_week">Last week</option>
                        <option value="2">Last 2 days</option>
                        <option value="3">Last 3 days</option>
                        <option value="5">Last 5 days</option>
                        <option value="7">Last 7 days</option>
                        <option value="14" selected>Last 14 days</option>
                        <option value="30">Last 30 days</option>
                        <option value="this_month">This month</option>
                        <option value="last_month">Last month</option>
                        <option value="this_year">This year</option>
                        <option value="last_year">Last year</option>
                        <option value="all_time">All time</option>
                        <option value="custom">Custom date</option>
                    </select>
                    <div id="customDateRange" class="hidden flex items-center gap-2 mt-2">
                        <input type="date" id="customDateFrom" class="px-2 py-1.5 rounded text-sm bg-zinc-800 border border-zinc-600">
                        <span class="text-zinc-500">—</span>
                        <input type="date" id="customDateTo" class="px-2 py-1.5 rounded text-sm bg-zinc-800 border border-zinc-600">
                    </div>
                </div>
            </div>
            
            <!-- AI Agents Container -->
            <div id="agentsContainer" class="space-y-6">
                <!-- Will be populated by JS -->
            </div>
            
            <div id="noAgentsMessage" class="hidden text-center py-12 text-zinc-500">
                <i data-lucide="info" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                <p>No AI agents for Stop & Optimize yet.</p>
                <button onclick="addNewAgent()" class="mt-4 text-purple-400 hover:underline">Add your first agent</button>
            </div>
        </main>
    </div>
    
    <script>
        let agents = [];
        let providersConfig = {};
        const CATEGORY = 'stop_optimize';
        
        async function init() {
            setDefaultCustomDates();
            toggleCustomDate();
            await loadCampaigns();
            await loadProvidersConfig();
            await loadAgents();
            lucide.createIcons();
        }
        
        function setDefaultCustomDates() {
            const to = new Date();
            const from = new Date(to);
            from.setDate(from.getDate() - 13);
            const elFrom = document.getElementById('customDateFrom');
            const elTo = document.getElementById('customDateTo');
            if (elFrom) elFrom.value = from.toISOString().slice(0, 10);
            if (elTo) elTo.value = to.toISOString().slice(0, 10);
        }
        
        function toggleCustomDate() {
            const el = document.getElementById('customDateRange');
            if (!el) return;
            if (document.getElementById('periodSelect').value === 'custom') { el.classList.remove('hidden'); el.classList.add('flex'); }
            else { el.classList.add('hidden'); el.classList.remove('flex'); }
        }
        
        function getPeriodParams() {
            return buildPeriodQueryString('periodSelect', 'customDateFrom', 'customDateTo');
        }
        
        async function loadProvidersConfig() {
            const res = await fetch('/api/providers/config', { cache: 'no-store' });
            const data = await res.json();
            providersConfig = data.providers || {};
        }
        
        async function loadCampaigns() {
            const periodParam = getPeriodParams();
            const res = await fetch(`/api/metrics/campaigns?${periodParam}`);
            const data = await res.json();
            const select = document.getElementById('campaignSelect');
            const campaigns = data.campaigns || [];
            select.innerHTML = campaigns.length
                ? campaigns.map(c => `<option value="${escapeAttr(c.campaign_id)}">${escapeHtml((c.campaign || '').replace(/^Mediabuys\s*-\s*/i, ''))} (${escapeHtml(c.source || '')})</option>`).join('')
                : '<option value="">No campaigns</option>';
        }
        
        async function loadAgents() {
            const res = await fetch(`/api/agents?category=${CATEGORY}`);
            const data = await res.json();
            agents = data.agents;
            renderAgents();
        }
        
        function renderAgents() {
            const container = document.getElementById('agentsContainer');
            const noAgents = document.getElementById('noAgentsMessage');
            
            if (agents.length === 0) {
                container.innerHTML = '';
                noAgents.classList.remove('hidden');
                return;
            }
            
            noAgents.classList.add('hidden');
            container.innerHTML = agents.map((agent, idx) => `
                <div class="card p-6" id="agent-${idx}">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <h3 class="text-lg font-semibold">${escapeHtml(agent.agent_name)}</h3>
                            <button onclick="renameAgent(${idx})" class="text-zinc-500 hover:text-white"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                        </div>
                        <div class="flex items-center gap-4">
                            <label class="toggle-switch">
                                <input type="checkbox" ${agent.enabled ? 'checked' : ''} 
                                       onchange="toggleAgent(${idx}, this.checked)">
                                <span class="toggle-slider"></span>
                            </label>
                            <button onclick="deleteAgent(${idx})" class="text-zinc-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="text-sm text-zinc-400 block mb-1">Provider</label>
                            <select id="provider-${idx}" class="w-full" onchange="onProviderChange(${idx})">
                                <option value="groq" ${agent.provider === 'groq' ? 'selected' : ''}>Groq</option>
                                <option value="openrouter" ${agent.provider === 'openrouter' ? 'selected' : ''}>OpenRouter</option>
                                <option value="deepseek" ${agent.provider === 'deepseek' ? 'selected' : ''}>DeepSeek</option>
                                <option value="google" ${agent.provider === 'google' ? 'selected' : ''}>Google</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-sm text-zinc-400 block mb-1">Model</label>
                            <div id="model-wrap-${idx}">${getModelBlockHtml(idx)}</div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-sm text-zinc-400 block mb-1">System Prompt</label>
                            <textarea id="prompt-${idx}" rows="6" class="w-full text-sm font-mono" onchange="updateAgent(${idx})">${escapeHtml(agent.system_prompt)}</textarea>
                        </div>
                        <div>
                            <label class="text-sm text-zinc-400 block mb-1">AI Response Preview</label>
                            <div id="response-${idx}" class="w-full h-40 bg-zinc-900 rounded-lg p-3 text-sm overflow-y-auto text-zinc-400 whitespace-pre-wrap">
                                Click "Test" to see response
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex gap-3 mt-4">
                        <button onclick="testAgent(${idx})" class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                            <i data-lucide="play" class="w-4 h-4"></i> Test
                        </button>
                        <button onclick="saveAgent(${idx})" class="btn-success px-4 py-2 rounded-lg flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Save
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        
        function addNewAgent() {
            const name = prompt('Enter agent name (e.g. Risk Manager):');
            if (!name) return;
            agents.push({
                agent_name: name,
                enabled: true,
                provider: 'groq',
                model: 'llama-3.1-70b-versatile',
                system_prompt: 'You are a Risk Manager for affiliate marketing campaigns. Analyze the data and recommend if we should STOP or OPTIMIZE the campaign.',
                category: CATEGORY
            });
            renderAgents();
        }

        function renameAgent(idx) {
            const newName = prompt('New name for agent:', agents[idx].agent_name);
            if (newName && newName !== agents[idx].agent_name) {
                agents[idx].agent_name = newName;
                renderAgents();
            }
        }
        
        async function deleteAgent(idx) {
            if (!confirm('Delete this agent?')) return;
            // Here we should ideally have a DELETE endpoint, but for now we can just not save it.
            // Or we can add a delete endpoint to ai_agents.py
            agents.splice(idx, 1);
            renderAgents();
        }

        function toggleAgent(idx, enabled) {
            agents[idx].enabled = enabled;
            updateAgent(idx);
            saveAgent(idx, true);
        }
        
        function getProviderModels(provider) {
            return (providersConfig[provider] && providersConfig[provider].models) || [];
        }
        
        function escapeAttr(s) { return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
        function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        
        function getModelBlockHtml(idx) {
            const agent = agents[idx];
            const models = getProviderModels(agent.provider);
            const currentModel = (agent.model || '').trim();
            if (models.length === 0) {
                return `<input type="text" id="model-custom-${idx}" value="${escapeAttr(currentModel)}" class="w-full" placeholder="e.g. llama-3.1-70b" oninput="updateAgent(${idx})">`;
            }
            const inList = models.includes(currentModel);
            const options = models.map(m => `<option value="${escapeAttr(m)}" ${currentModel === m ? 'selected' : ''}>${escapeHtml(m)}</option>`).join('')
                + `<option value="__other__" ${!inList ? 'selected' : ''}>Other (type below)</option>`;
            const inputClass = inList ? 'w-full mt-1 hidden' : 'w-full mt-1';
            const inputVal = inList ? '' : currentModel;
            return `<select id="model-select-${idx}" class="w-full" onchange="onModelSelectChange(${idx})">${options}</select>
                <input type="text" id="model-custom-${idx}" value="${escapeAttr(inputVal)}" class="${inputClass}" placeholder="Model id" oninput="updateAgent(${idx})">`;
        }
        
        function getModelValue(idx) {
            const sel = document.getElementById(`model-select-${idx}`);
            const inp = document.getElementById(`model-custom-${idx}`);
            if (sel && sel.value && sel.value !== '__other__') return sel.value;
            return inp ? inp.value.trim() : '';
        }
        
        function updateAgent(idx) {
            agents[idx].provider = document.getElementById(`provider-${idx}`).value;
            agents[idx].model = getModelValue(idx);
            agents[idx].system_prompt = document.getElementById(`prompt-${idx}`).value;
            agents[idx].category = CATEGORY;
        }
        
        function onModelSelectChange(idx) {
            const sel = document.getElementById(`model-select-${idx}`);
            const inp = document.getElementById(`model-custom-${idx}`);
            if (inp) inp.classList.toggle('hidden', sel && sel.value !== '__other__');
            updateAgent(idx);
        }
        
        function onProviderChange(idx) {
            updateAgent(idx);
            const wrap = document.getElementById(`model-wrap-${idx}`);
            if (wrap) wrap.innerHTML = getModelBlockHtml(idx);
        }
        
        async function testAgent(idx) {
            updateAgent(idx);
            const agent = agents[idx];
            const responseDiv = document.getElementById(`response-${idx}`);
            responseDiv.innerHTML = '<span class="text-yellow-400">Testing...</span>';
            
            const campaignId = document.getElementById('campaignSelect').value;
            const periodParam = getPeriodParams();
            let data;
            if (campaignId) {
                const res = await fetch(`/api/metrics/campaign-breakdown?campaign_id=${encodeURIComponent(campaignId)}&${periodParam}`);
                data = await res.json();
            } else {
                const res = await fetch(`/api/metrics/summary?${periodParam}`);
                data = await res.json();
            }
            
            const testRes = await fetch('/api/agents/test', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    provider: agent.provider,
                    model: agent.model,
                    system_prompt: agent.system_prompt,
                    campaign_data: data
                })
            });
            
            const result = await testRes.json();
            if (result.success) {
                responseDiv.innerHTML = result.response;
            } else {
                responseDiv.innerHTML = `<span class="text-red-400">Error: ${result.error}</span>`;
            }
        }
        
        async function saveAgent(idx, silent) {
            updateAgent(idx);
            const agent = agents[idx];
            const res = await fetch(`/api/agents/${encodeURIComponent(agent.agent_name)}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(agent)
            });
            const data = await res.json();
            if (!silent) alert(data.success ? '✓ Saved!' : '✗ Error');
        }
        
        init();
    </script>
</body>
</html>
