<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; }
        .btn-primary { background: #8b5cf6; }
        .btn-success { background: #22c55e; }
        .btn-github { background: #333; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #8b5cf6; }
        select, textarea, input[type="text"] { background: #12121a; border: 1px solid #2a2a3a; color: #fff; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-6">
            <h1 class="text-2xl font-bold mb-6 flex items-center gap-2"><i data-lucide="settings" class="w-6 h-6"></i>Settings</h1>
            
            <!-- Git Commit Section -->
            <div class="card p-4 mb-6">
                <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="git-branch" class="w-4 h-4"></i>Git Backup</h3>
                <div class="flex gap-3">
                    <input type="text" id="commitMessage" placeholder="Commit message..." class="flex-1 px-3 py-2 rounded-lg">
                    <button onclick="gitCommit()" class="btn-github px-4 py-2 rounded-lg flex items-center gap-2">
                        <i data-lucide="github" class="w-4 h-4"></i>Push to GitHub
                    </button>
                </div>
                <div id="gitStatus" class="text-sm mt-3"></div>
            </div>
            
            <!-- AI Council Settings -->
            <div class="card p-4 mb-6">
                <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="bot" class="w-4 h-4"></i>AI Council Settings</h3>
                <div class="flex items-center gap-4 mb-4">
                    <select id="campaignSelect" class="flex-1 px-3 py-2 rounded-lg"><option value="">Select campaign for testing...</option></select>
                    <button onclick="loadCampaign()" class="btn-primary px-4 py-2 rounded-lg">Load</button>
                </div>
                <div id="cacheStatus" class="text-xs text-zinc-500 mb-4">No campaign loaded</div>
            </div>
            
            <div id="rolesContainer" class="space-y-4"></div>
            <button onclick="saveAll()" class="w-full btn-success py-3 rounded-xl font-bold mt-6">Save All AI Settings</button>
        </main>
    </div>
    <script>
        const roles = [
            { id: 'bot_pro', name: 'BOT PRO', icon: '👍' },
            { id: 'bot_con', name: 'BOT CON', icon: '👎' },
            { id: 'analyst', name: 'ANALYST', icon: '📊' },
            { id: 'strategist', name: 'STRATEGIST', icon: '🎯' },
            { id: 'risk', name: 'RISK MANAGER', icon: '⚠️' },
            { id: 'monetizer', name: 'MONETIZER', icon: '💰' },
            { id: 'visionary', name: 'VISIONARY', icon: '🔮' },
            { id: 'ceo', name: 'CEO', icon: '👑' }
        ];
        const providers = ['openrouter', 'groq', 'google', 'siliconflow'];
        let cached = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            renderRoles();
            loadCampaigns();
        });

        async function gitCommit() {
            const msg = document.getElementById('commitMessage').value || 'Auto backup';
            const status = document.getElementById('gitStatus');
            status.innerHTML = '<span class="text-yellow-400">Pushing to GitHub...</span>';
            
            try {
                const res = await fetch('/api/ai-settings/git/commit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                if (data.success) {
                    status.innerHTML = '<span class="text-green-400">✓ ' + data.message + '</span>';
                    document.getElementById('commitMessage').value = '';
                } else {
                    status.innerHTML = '<span class="text-red-400">✗ ' + data.error + '</span>';
                }
            } catch (e) {
                status.innerHTML = '<span class="text-red-400">✗ ' + e.message + '</span>';
            }
        }

        function renderRoles() {
            document.getElementById('rolesContainer').innerHTML = roles.map(r => `
                <div class="card p-4">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-2xl">${r.icon}</span>
                        <span class="font-bold">${r.name}</span>
                        <select id="${r.id}-provider" class="px-2 py-1 rounded text-sm">${providers.map(p => `<option value="${p}">${p}</option>`).join('')}</select>
                        <label class="ml-auto flex items-center gap-1"><input type="checkbox" id="${r.id}-enabled" checked> On</label>
                    </div>
                    <textarea id="${r.id}-prompt" rows="2" class="w-full p-2 rounded text-sm" placeholder="Prompt...">${r.name} analysis prompt</textarea>
                    <div class="flex gap-2 mt-2">
                        <button onclick="saveRole('${r.id}')" class="btn-success px-3 py-1 rounded text-sm">Save</button>
                        <button onclick="testRole('${r.id}')" class="btn-primary px-3 py-1 rounded text-sm">Test</button>
                        <span id="${r.id}-status" class="text-xs text-zinc-400 ml-2"></span>
                    </div>
                </div>
            `).join('');
        }

        async function loadCampaigns() {
            const res = await fetch('/api/bot-agent/top5?period=7');
            const data = await res.json();
            document.getElementById('campaignSelect').innerHTML = '<option value="">Select...</option>' + data.campaigns.map(c => `<option value="${c.campaign_id}">${c.campaign} (ROI: ${c.roi}%)</option>`).join('');
        }

        async function loadCampaign() {
            const id = document.getElementById('campaignSelect').value;
            if (!id) return;
            const res = await fetch(`/api/bot-agent/analyze?campaign_id=${id}&period=7`, { method: 'POST' });
            cached = await res.json();
            document.getElementById('cacheStatus').textContent = '✅ Loaded: ' + cached.campaign;
        }

        async function saveRole(id) {
            await fetch('/api/ai-settings/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: id, provider: document.getElementById(id + '-provider').value, model: 'default', prompt: document.getElementById(id + '-prompt').value, enabled: document.getElementById(id + '-enabled').checked })
            });
            document.getElementById(id + '-status').textContent = '✅ Saved';
        }

        async function testRole(id) {
            if (!cached) return alert('Load campaign first');
            document.getElementById(id + '-status').textContent = 'Testing...';
            const res = await fetch('/api/ai-settings/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: id, provider: document.getElementById(id + '-provider').value, model: 'default', prompt: document.getElementById(id + '-prompt').value, campaign_data: cached })
            });
            const data = await res.json();
            document.getElementById(id + '-status').textContent = '✅ ' + JSON.stringify(data.response);
        }

        async function saveAll() {
            for (const r of roles) await saveRole(r.id);
            alert('All saved!');
        }
    </script>
</body>
</html>
