<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; }
        .btn-primary { background: #8b5cf6; }
        .btn-success { background: #22c55e; }
        .btn-github { background: #333; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #8b5cf6; }
        select, textarea, input[type="text"] { background: #12121a; border: 1px solid #2a2a3a; color: #fff; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/bot-top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-6">
            <h1 class="text-2xl font-bold mb-6 flex items-center gap-2"><i data-lucide="settings" class="w-6 h-6"></i>Settings</h1>
            
            <!-- Git Commit Section -->
            <div class="card p-4 mb-6">
                <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="git-branch" class="w-4 h-4"></i>Git Backup</h3>
                <div class="flex gap-3">
                    <input type="text" id="commitMessage" placeholder="Commit message..." class="flex-1 px-3 py-2 rounded-lg">
                    <button onclick="gitCommit()" class="btn-github px-4 py-2 rounded-lg flex items-center gap-2">
                        <i data-lucide="github" class="w-4 h-4"></i>Push to GitHub
                    </button>
                </div>
                <div id="gitStatus" class="text-sm mt-3"></div>
            </div>
            
            <!-- General Settings Section -->
            <div class="card p-4 mb-6">
                <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="settings" class="w-4 h-4"></i>General Settings</h3>
                <a href="/general-settings" class="btn-primary px-4 py-2 rounded-lg inline-flex items-center gap-2 hover:opacity-90">
                    <i data-lucide="sliders" class="w-4 h-4"></i>Open General Settings
                </a>
            </div>
            
            <!-- AI Council Settings Section -->
            <div class="card p-4 mb-6">
                <h3 class="font-semibold mb-4 flex items-center gap-2"><i data-lucide="brain" class="w-4 h-4"></i>AI Council Settings</h3>
                <button onclick="openAIModal()" class="btn-primary px-4 py-2 rounded-lg inline-flex items-center gap-2 hover:opacity-90">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>Configure AI Council
                </button>
            </div>
            
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        async function gitCommit() {
            const msg = document.getElementById('commitMessage').value || 'Auto backup';
            const status = document.getElementById('gitStatus');
            status.innerHTML = '<span class="text-yellow-400">Pushing to GitHub...</span>';
            
            try {
                const res = await fetch('/api/ai-settings/git/commit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await res.json();
                if (data.success) {
                    status.innerHTML = '<span class="text-green-400">✓ ' + data.message + '</span>';
                    document.getElementById('commitMessage').value = '';
                } else {
                    status.innerHTML = '<span class="text-red-400">✗ ' + data.error + '</span>';
                }
            } catch (e) {
                status.innerHTML = '<span class="text-red-400">✗ ' + e.message + '</span>';
            }
        }
    </script>

    <!-- AI Council Modal -->
    <div id="aiModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="card p-6 w-96">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold text-lg">AI Council Settings</h3>
                <button onclick="closeAIModal()" class="text-zinc-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-3">
                <a href="/ai-connect-models" class="block w-full text-center py-3 rounded-lg bg-purple-600 hover:bg-purple-700 transition font-semibold">
                    Connect Models
                </a>
                <a href="/ai-top5" class="block w-full text-center py-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition">
                    Settings Top 5
                </a>
                <a href="/ai-search-gold" class="block w-full text-center py-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition">
                    Settings Search for Gold
                </a>
                <a href="/ai-company-analysis" class="block w-full text-center py-3 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition">
                    Settings Company Analysis
                </a>
            </div>
        </div>
    </div>
    
    <script>
        function openAIModal() {
            document.getElementById('aiModal').classList.remove('hidden');
            document.getElementById('aiModal').classList.add('flex');
            lucide.createIcons();
        }
        function closeAIModal() {
            document.getElementById('aiModal').classList.add('hidden');
            document.getElementById('aiModal').classList.remove('flex');
        }
    </script>
</body>
</html>
