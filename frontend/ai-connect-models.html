<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Models - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #8b5cf6; }
        .btn-primary { background: #8b5cf6; }
        .btn-success { background: #22c55e; }
        input { background: #12121a; border: 1px solid #2a2a3a; color: #fff; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/bot-top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-6">
            <div class="flex items-center gap-3 mb-6">
                <a href="/settings" class="text-zinc-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <h1 class="text-2xl font-bold">Connect Models</h1>
            </div>
            
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-zinc-200">Connected Providers</h2>
                <button onclick="openAddProviderModal()" class="btn-primary px-3 py-2 rounded-lg text-sm">
                    + Add custom provider
                </button>
            </div>

            <div id="providersGrid" class="grid grid-cols-2 gap-6">
                <!-- Groq -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-orange-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">⚡</span>
                        </div>
                        <h3 class="font-semibold text-lg">Groq</h3>
                    </div>
                    <input type="password" id="groqKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('groq')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="groqStatus" class="text-sm"></div>
                    <div id="groqModels" class="mt-3 hidden"></div>
                    <button onclick="saveProvider('groq')" class="btn-success w-full px-4 py-2 rounded-lg mt-3 text-sm">
                        Save
                    </button>
                    <div id="groqSaveStatus" class="text-xs mt-1 text-zinc-400"></div>
                </div>
                
                <!-- OpenRouter -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">🔀</span>
                        </div>
                        <h3 class="font-semibold text-lg">OpenRouter</h3>
                    </div>
                    <input type="password" id="openrouterKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('openrouter')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="openrouterStatus" class="text-sm"></div>
                    <div id="openrouterModels" class="mt-3 hidden"></div>
                    <button onclick="saveProvider('openrouter')" class="btn-success w-full px-4 py-2 rounded-lg mt-3 text-sm">
                        Save
                    </button>
                    <div id="openrouterSaveStatus" class="text-xs mt-1 text-zinc-400"></div>
                </div>
                
                <!-- DeepSeek -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-purple-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">🧠</span>
                        </div>
                        <h3 class="font-semibold text-lg">DeepSeek</h3>
                    </div>
                    <input type="password" id="deepseekKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('deepseek')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="deepseekStatus" class="text-sm"></div>
                    <div id="deepseekModels" class="mt-3 hidden"></div>
                    <button onclick="saveProvider('deepseek')" class="btn-success w-full px-4 py-2 rounded-lg mt-3 text-sm">
                        Save
                    </button>
                    <div id="deepseekSaveStatus" class="text-xs mt-1 text-zinc-400"></div>
                </div>
                
                <!-- Google -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-green-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">🔮</span>
                        </div>
                        <h3 class="font-semibold text-lg">Google Gemini</h3>
                    </div>
                    <input type="password" id="googleKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('google')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="googleStatus" class="text-sm"></div>
                    <div id="googleModels" class="mt-3 hidden"></div>
                    <button onclick="saveProvider('google')" class="btn-success w-full px-4 py-2 rounded-lg mt-3 text-sm">
                        Save
                    </button>
                    <div id="googleSaveStatus" class="text-xs mt-1 text-zinc-400"></div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Add custom provider modal -->
    <div id="addProviderModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="card p-6 w-96">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-semibold text-lg">Add Custom Provider</h3>
                <button onclick="closeAddProviderModal()" class="text-zinc-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-zinc-400 block mb-1">Provider ID (latin, no spaces)</label>
                    <input id="customProviderId" type="text" class="w-full px-3 py-2 rounded-lg" placeholder="e.g. myprovider">
                </div>
                <div>
                    <label class="text-xs text-zinc-400 block mb-1">Display name</label>
                    <input id="customProviderName" type="text" class="w-full px-3 py-2 rounded-lg" placeholder="My Provider">
                </div>
                <div>
                    <label class="text-xs text-zinc-400 block mb-1">Base URL (models endpoint)</label>
                    <input id="customProviderUrl" type="text" class="w-full px-3 py-2 rounded-lg" placeholder="https://api.myprovider.com/v1/models">
                </div>
                <button onclick="createCustomProvider()" class="btn-primary w-full px-4 py-2 rounded-lg mt-2">
                    Create
                </button>
            </div>
        </div>
    </div>

    <script>
        let providerData = {};
        
        async function testProvider(provider) {
            const keyInput = document.getElementById(`${provider}Key`);
            const statusDiv = document.getElementById(`${provider}Status`);
            const modelsDiv = document.getElementById(`${provider}Models`);
            
            statusDiv.innerHTML = '<span class="text-yellow-400">Testing...</span>';
            
            // Для кастомных провайдеров берём base_url из поля `${provider}Url`, если есть
            const urlInput = document.getElementById(`${provider}Url`);
            const base_url = urlInput ? urlInput.value : null;

            try {
                const res = await fetch('/api/providers/test', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({provider, api_key: keyInput.value, base_url})
                });
                const data = await res.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '<span class="text-green-400">✓ Connected</span>';
                    providerData[provider] = {key: keyInput.value, models: data.models, base_url};
                    
                    modelsDiv.innerHTML = `
                        <div class="text-xs text-zinc-400 mb-2">Available models:</div>
                        ${data.models.map(m => `
                            <label class="flex items-center gap-2 text-sm py-1">
                                <input type="checkbox" value="${m.id}" checked> ${m.name}
                            </label>
                        `).join('')}
                    `;
                    modelsDiv.classList.remove('hidden');
                } else {
                    statusDiv.innerHTML = `<span class="text-red-400">✗ ${data.error}</span>`;
                }
            } catch (err) {
                statusDiv.innerHTML = '<span class="text-red-400">✗ Connection failed</span>';
            }
        }
        
        async function saveProvider(provider) {
            const keyInput = document.getElementById(`${provider}Key`);
            const modelsDiv = document.getElementById(`${provider}Models`);
            const saveStatus = document.getElementById(`${provider}SaveStatus`);

            if (!keyInput) {
                alert('Key input not found for ' + provider);
                return;
            }

            const checkedModels = modelsDiv
                ? Array.from(modelsDiv.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value)
                : [];

            providerData[provider] = {
                key: keyInput.value,
                models: checkedModels
            };

            if (saveStatus) saveStatus.textContent = 'Saving...';

            try {
                const res = await fetch('/api/providers/save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ [provider]: providerData[provider] })
                });
                const data = await res.json();
                if (saveStatus) {
                    saveStatus.textContent = data.success ? '✓ Saved' : '✗ Error saving';
                }
            } catch (e) {
                if (saveStatus) saveStatus.textContent = '✗ Error saving';
            }
        }

        function openAddProviderModal() {
            const modal = document.getElementById('addProviderModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            lucide.createIcons();
        }

        function closeAddProviderModal() {
            const modal = document.getElementById('addProviderModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function createCustomProvider() {
            const idInput = document.getElementById('customProviderId');
            const nameInput = document.getElementById('customProviderName');
            const urlInput = document.getElementById('customProviderUrl');
            const rawId = (idInput.value || '').trim();
            const displayName = (nameInput.value || '').trim() || rawId;
            const baseUrl = (urlInput.value || '').trim();

            if (!rawId) {
                alert('Provider ID is required');
                return;
            }

            const providerId = rawId.toLowerCase().replace(/\s+/g, '_');
            const grid = document.getElementById('providersGrid');

            // Если уже есть такой провайдер — просто закрываем модалку
            if (document.getElementById(providerId + 'Key')) {
                closeAddProviderModal();
                return;
            }

            const card = document.createElement('div');
            card.className = 'card p-6';
            card.innerHTML = `
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 bg-zinc-500/20 rounded-lg flex items-center justify-center">
                        <span class="text-2xl">✨</span>
                    </div>
                    <h3 class="font-semibold text-lg">${displayName}</h3>
                </div>
                <input type="password" id="${providerId}Key" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                <input type="text" id="${providerId}Url" placeholder="Base URL (models endpoint)" class="w-full px-3 py-2 rounded-lg mb-3" value="${baseUrl}">
                <button onclick="testProvider('${providerId}')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                    Test Connection
                </button>
                <div id="${providerId}Status" class="text-sm"></div>
                <div id="${providerId}Models" class="mt-3 hidden"></div>
                <button onclick="saveProvider('${providerId}')" class="btn-success w-full px-4 py-2 rounded-lg mt-3 text-sm">
                    Save
                </button>
                <div id="${providerId}SaveStatus" class="text-xs mt-1 text-zinc-400"></div>
            `;

            grid.appendChild(card);

            // Инициализация пустых данных
            providerData[providerId] = { key: '', models: [], base_url: baseUrl };

            // Очистка и закрытие модалки
            idInput.value = '';
            nameInput.value = '';
            urlInput.value = '';
            closeAddProviderModal();
        }

        lucide.createIcons();
    </script>
</body>
</html>
