<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connect Models - Affiliate Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background: #0a0a0f; color: #fff; font-family: system-ui, sans-serif; }
        .sidebar { background: #12121a; border-right: 1px solid #2a2a3a; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; }
        .nav-item { border-radius: 8px; }
        .nav-item:hover { background: rgba(139,92,246,0.1); }
        .nav-item.active { background: #8b5cf6; }
        .btn-primary { background: #8b5cf6; }
        .btn-success { background: #22c55e; }
        input { background: #12121a; border: 1px solid #2a2a3a; color: #fff; }
    </style>
</head>
<body class="min-h-screen">
    <div class="flex">
        <aside class="sidebar w-56 h-screen fixed flex flex-col p-4">
            <div class="flex items-center gap-2 mb-8">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center">
                    <i data-lucide="brain" class="w-5 h-5"></i>
                </div>
                <span class="font-bold">AFFILIATE BRAIN</span>
            </div>
            <nav class="flex-1 space-y-1">
                <div class="text-xs text-zinc-500 mb-2 px-3">ANALYSIS</div>
                <a href="/" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">INTELLIGENCE</div>
                <a href="/top5" class="nav-item flex items-center gap-3 px-3 py-2"><i data-lucide="trophy" class="w-4 h-4"></i>TOP-5</a>
                <div class="text-xs text-zinc-500 mb-2 mt-4 px-3">SYSTEM</div>
                <a href="/settings" class="nav-item active flex items-center gap-3 px-3 py-2"><i data-lucide="settings" class="w-4 h-4"></i>Settings</a>
            </nav>
        </aside>
        <main class="ml-56 flex-1 p-6">
            <div class="flex items-center gap-3 mb-6">
                <a href="/settings" class="text-zinc-400 hover:text-white"><i data-lucide="arrow-left" class="w-5 h-5"></i></a>
                <h1 class="text-2xl font-bold">Connect Models</h1>
            </div>
            
            <div class="grid grid-cols-2 gap-6">
                <!-- Groq -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-orange-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">⚡</span>
                        </div>
                        <h3 class="font-semibold text-lg">Groq</h3>
                    </div>
                    <input type="password" id="groqKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('groq')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="groqStatus" class="text-sm"></div>
                    <div id="groqModels" class="mt-3 hidden"></div>
                </div>
                
                <!-- OpenRouter -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-blue-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">🔀</span>
                        </div>
                        <h3 class="font-semibold text-lg">OpenRouter</h3>
                    </div>
                    <input type="password" id="openrouterKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('openrouter')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="openrouterStatus" class="text-sm"></div>
                    <div id="openrouterModels" class="mt-3 hidden"></div>
                </div>
                
                <!-- DeepSeek -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-purple-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">🧠</span>
                        </div>
                        <h3 class="font-semibold text-lg">DeepSeek</h3>
                    </div>
                    <input type="password" id="deepseekKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('deepseek')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="deepseekStatus" class="text-sm"></div>
                    <div id="deepseekModels" class="mt-3 hidden"></div>
                </div>
                
                <!-- Google -->
                <div class="card p-6">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-10 h-10 bg-green-500/20 rounded-lg flex items-center justify-center">
                            <span class="text-2xl">🔮</span>
                        </div>
                        <h3 class="font-semibold text-lg">Google Gemini</h3>
                    </div>
                    <input type="password" id="googleKey" placeholder="API Key" class="w-full px-3 py-2 rounded-lg mb-3">
                    <button onclick="testProvider('google')" class="btn-primary w-full px-4 py-2 rounded-lg mb-3">
                        Test Connection
                    </button>
                    <div id="googleStatus" class="text-sm"></div>
                    <div id="googleModels" class="mt-3 hidden"></div>
                </div>
            </div>
            
            <div class="mt-6 text-center">
                <button onclick="saveKeys()" class="btn-success px-8 py-3 rounded-lg text-lg">
                    Save All Keys
                </button>
            </div>
        </main>
    </div>
    
    <script>
        let providerData = {};
        
        async function testProvider(provider) {
            const keyInput = document.getElementById(`${provider}Key`);
            const statusDiv = document.getElementById(`${provider}Status`);
            const modelsDiv = document.getElementById(`${provider}Models`);
            
            statusDiv.innerHTML = '<span class="text-yellow-400">Testing...</span>';
            
            try {
                const res = await fetch('/api/providers/test', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({provider, api_key: keyInput.value})
                });
                const data = await res.json();
                
                if (data.success) {
                    statusDiv.innerHTML = '<span class="text-green-400">✓ Connected</span>';
                    providerData[provider] = {key: keyInput.value, models: data.models};
                    
                    modelsDiv.innerHTML = `
                        <div class="text-xs text-zinc-400 mb-2">Available models:</div>
                        ${data.models.map(m => `
                            <label class="flex items-center gap-2 text-sm py-1">
                                <input type="checkbox" value="${m.id}" checked> ${m.name}
                            </label>
                        `).join('')}
                    `;
                    modelsDiv.classList.remove('hidden');
                } else {
                    statusDiv.innerHTML = `<span class="text-red-400">✗ ${data.error}</span>`;
                }
            } catch (err) {
                statusDiv.innerHTML = '<span class="text-red-400">✗ Connection failed</span>';
            }
        }
        
        async function saveKeys() {
            const res = await fetch('/api/providers/save', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(providerData)
            });
            const data = await res.json();
            alert(data.success ? 'Keys saved!' : 'Error saving keys');
        }
        
        lucide.createIcons();
    </script>
</body>
</html>
